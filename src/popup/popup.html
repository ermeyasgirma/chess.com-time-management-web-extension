<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess Time Manager</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1 class="popup__title">Chess Time Manager</h1>
          <p class="popup__subtitle">Time alerts for Chess.com live games</p>
        </div>
      </header>

      <form id="settings-form" class="popup__form">
        <section class="panel" aria-labelledby="status-heading">
          <h2 id="status-heading" class="panel__title">Status</h2>
          <dl class="status-grid">
            <div>
              <dt>Warnings</dt>
              <dd id="warnings-status">Loading</dd>
            </div>
            <div>
              <dt>Threshold</dt>
              <dd id="threshold-status">15s</dd>
            </div>
            <div>
              <dt>Debug panel</dt>
              <dd id="debug-status">Off</dd>
            </div>
            <div>
              <dt>Sound</dt>
              <dd id="sound-status">On</dd>
            </div>
          </dl>
        </section>

        <section class="panel" aria-labelledby="settings-heading">
          <h2 id="settings-heading" class="panel__title">Settings</h2>

          <label class="switch">
            <input id="enabled" type="checkbox">
            <span>Enable warnings</span>
          </label>

          <label class="field" for="threshold-seconds">
            <span class="field__label">Warning threshold</span>
            <span class="field__control">
              <input id="threshold-seconds" type="number" min="1" max="300" step="1">
              <span class="field__suffix">seconds</span>
            </span>
          </label>

          <label class="field" for="warning-mode">
            <span class="field__label">Warning output</span>
            <select id="warning-mode">
              <option value="visual-and-audio">Visual + sound</option>
              <option value="audio-only">Sound only</option>
              <option value="visual-only">Visual only</option>
            </select>
          </label>

          <label class="field" for="volume-percent">
            <span class="field__label">Sound volume</span>
            <span class="field__control field__control--range">
              <input id="volume-percent" type="range" min="0" max="100" step="5">
              <span id="volume-value" class="field__suffix">80%</span>
            </span>
          </label>

          <label class="switch">
            <input id="debug-overlay-enabled" type="checkbox">
            <span>Show debug overlay</span>
          </label>
        </section>

        <div class="popup__actions">
          <button class="button button--primary" type="submit">Save</button>
          <button id="test-sound" class="button" type="button">Test sound</button>
          <button id="reset-defaults" class="button" type="button">Reset</button>
        </div>

        <p id="status" class="popup__status" role="status"></p>
      </form>
    </main>

    <script src="../shared/settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
